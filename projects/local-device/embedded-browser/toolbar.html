<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src https: http:; form-action 'none'"
    />
    <title>伯仁连接器</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8f8;
        --surface: #fff;
        --ink: #0f172a;
        --muted: #475569;
        --line: #e2e8f0;
        --accent: #28823b;
        --selected: #eaf6ed;
        --primary: #247434;
        --primary-hover: #1b602a;
        accent-color: var(--accent);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171c19;
          --surface: #202722;
          --ink: #eff6f0;
          --muted: #acbcb0;
          --line: #36443a;
          --accent: #9fdeac;
          --selected: #2b4733;
        }
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        font:
          13px system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      nav {
        height: 38px;
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 4px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      button,
      input {
        color: inherit;
        font: inherit;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 8px;
        min-height: 32px;
        padding: 0 11px;
      }
      button {
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        background: var(--selected);
      }
      input {
        min-width: 0;
        flex: 1;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      nav button {
        min-height: 28px;
        border-color: transparent;
        background: none;
        color: var(--muted);
      }
      nav button[aria-current='page'],
      button[aria-pressed='true'] {
        background: var(--selected);
        color: var(--accent);
        font-weight: 600;
      }
      #tab-strip {
        height: 40px;
        display: flex;
        align-items: flex-end;
        gap: 2px;
        padding: 0 12px 0 84px;
        background: var(--bg);
        overflow: hidden;
        -webkit-app-region: drag;
      }
      #tab-strip button,
      #tab-list {
        -webkit-app-region: no-drag;
      }
      #tab-list {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tab {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 220px;
        min-width: 96px;
        height: 34px;
        padding: 0 8px 0 12px;
        border: 0;
        border-radius: 10px 10px 0 0;
        background: transparent;
        color: var(--muted);
        cursor: default;
        font-size: 12px;
      }
      .tab:not([aria-selected='true']):hover {
        background: color-mix(in srgb, var(--ink) 5%, transparent);
      }
      .tab:not([aria-selected='true']):not(:last-child)::after {
        content: '';
        position: absolute;
        right: -1px;
        top: 9px;
        width: 1px;
        height: 16px;
        background: var(--line);
      }
      .tab[aria-selected='true'] {
        background: var(--surface);
        color: var(--ink);
        font-weight: 600;
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--line) 45%, transparent);
        z-index: 1;
      }
      .tab.pinned {
        min-width: auto;
        padding: 0 12px;
        gap: 6px;
        cursor: pointer;
        flex: none;
      }
      .tab.pinned span {
        flex: none;
        overflow: visible;
      }
      .tab.pinned svg {
        width: 14px;
        height: 14px;
      }
      .tab span {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .tab .close {
        min-height: 0;
        width: 18px;
        height: 18px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: none;
        line-height: 18px;
      }
      #new-tab {
        min-height: 0;
        height: 28px;
        width: 28px;
        padding: 0;
        margin: 0 0 3px 4px;
        border: 0;
        border-radius: 50%;
        background: none;
        font-size: 16px;
      }
      #browser-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        height: 48px;
        padding: 6px 16px;
        border-bottom: 1px solid var(--line);
      }
      #management {
        width: min(100%, 840px);
        margin: auto;
        padding: 32px clamp(18px, 4vw, 44px);
      }
      .heading {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .mark,
      .avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 13px;
        background: var(--selected);
        color: var(--accent);
        font-weight: 700;
      }
      .heading-copy {
        flex: 1;
        min-width: 180px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -0.025em;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      p {
        margin: 5px 0 0;
        color: var(--muted);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .primary {
        color: white;
        background: var(--primary);
        border-color: var(--primary);
        font-weight: 600;
      }
      .primary:hover {
        background: var(--primary-hover);
      }
      .search {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .search input {
        border: 0;
        background: none;
        padding: 0;
        min-height: 38px;
      }
      .search output {
        color: var(--muted);
        white-space: nowrap;
      }
      #accounts {
        margin: 14px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 9px;
      }
      .card {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .account,
      .session {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .account .avatar {
        width: 38px;
        height: 38px;
      }
      .identity {
        flex: 1;
        min-width: 135px;
        overflow-wrap: anywhere;
      }
      .identity p {
        font-size: 12px;
      }
      .name {
        border: 0;
        background: none;
        text-align: left;
        padding: 0;
        min-height: 0;
        color: var(--accent);
        font-weight: 650;
        white-space: normal;
      }
      .pill {
        font-size: 11px;
        color: var(--muted);
        padding: 4px 8px;
        border-radius: 999px;
        background: var(--bg);
        white-space: nowrap;
      }
      .pill[data-state='active'] {
        color: #167244;
        background: #e5f6eb;
      }
      .pill[data-state='paused'] {
        color: #92500d;
        background: #fff2d9;
      }
      .danger {
        color: #b73b37;
      }
      .subpage > .back {
        margin-bottom: 16px;
      }
      .subpage h1 {
        margin-bottom: 15px;
      }
      .subpage form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .subpage form input {
        min-width: 160px;
      }
      #detail-content {
        display: grid;
        gap: 10px;
      }
      #management-error {
        color: #b73b37;
        margin: 10px 0;
      }
      .empty {
        padding: 24px 10px;
        text-align: center;
        color: var(--muted);
      }
      footer {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }
      nav {
        justify-content: center;
        gap: 0;
        background: var(--bg);
      }
      nav button {
        min-width: 110px;
        background: color-mix(in srgb, var(--ink) 7%, var(--bg));
        border-radius: 8px;
      }
      nav button[aria-current='page'] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 4px #18243828;
      }
      #management {
        display: flex;
        flex-direction: column;
        width: min(86%, 960px);
        min-height: calc(100vh - 138px);
        padding: clamp(22px, 3.3vw, 46px);
        margin: 44px auto 32px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 17px;
        box-shadow: 0 8px 32px #1824380d;
      }
      h1 {
        font-size: clamp(24px, 2.5vw, 32px);
      }
      .heading {
        margin-bottom: 27px;
      }
      .search,
      #browser-toolbar .address {
        background: color-mix(in srgb, var(--bg) 75%, var(--surface));
      }
      .search input {
        min-height: 44px;
        font-size: 15px;
      }
      .search:focus-within,
      .address:focus-within {
        outline: 2px solid var(--accent);
      }
      .search input:focus-visible,
      .address input:focus-visible {
        outline: none;
      }
      #accounts {
        gap: 0;
        margin-top: 22px;
        border-bottom: 1px solid var(--line);
      }
      .account.card,
      .session.card {
        border-width: 1px 0 0;
        border-radius: 0;
        padding: 19px 8px;
        gap: 18px;
      }
      .avatar,
      .account .avatar {
        width: 64px;
        height: 64px;
        overflow: hidden;
        border-radius: 50%;
        flex: none;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .name {
        color: var(--ink);
        font-size: 19px;
      }
      .identity p {
        font-size: 14px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
      }
      .pill::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      footer {
        margin-top: auto;
        padding-top: 24px;
      }
      #browser-toolbar {
        background: var(--surface);
        gap: 5px;
      }
      .address {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 0 4px 0 12px;
        flex: 1;
        min-width: 0;
      }
      .address input {
        border: 0;
        padding: 0;
        background: transparent;
      }
      svg {
        width: 18px;
        height: 18px;
        flex: none;
        vertical-align: middle;
      }
      button.icon {
        display: inline-grid;
        place-items: center;
        padding: 0;
        height: 32px;
        width: 32px;
        border: 0;
        background: transparent;
        color: var(--muted);
      }
      button.icon:hover,
      button.icon[aria-pressed='true'] {
        background: var(--selected);
        color: var(--accent);
      }
      button.icon.primary {
        width: 40px;
        height: 36px;
        background: var(--primary);
        color: white;
      }
      button.icon.danger:hover {
        color: #c33232;
      }
      .subpage input {
        padding: 8px 12px;
      }
      .search > svg,
      .address > svg {
        color: var(--muted);
      }
      button[data-tip] { position: relative; }
      button[data-tip]:is(:hover, :focus-visible)::after {
        content: attr(data-tip);
        position: absolute;
        z-index: 10;
        bottom: calc(100% + 3px);
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        border-radius: 6px;
        padding: 4px 9px;
        background: #202733;
        color: white;
        font: 500 12px/18px system-ui, sans-serif;
        box-shadow: 0 2px 8px #0003;
        white-space: nowrap;
      }
      /* 浏览器和工具栏是独立视图；贴着按钮内侧展示，避免窗口边缘和网页裁切。 */
      #browser-toolbar button[data-tip]:is(:hover, :focus-visible)::after {
        bottom: 50%; transform: translateY(50%); left: calc(100% + 4px);
      }
      #browser-toolbar :is(#pause, button[type='submit'])[data-tip]:is(:hover, :focus-visible)::after {
        left: auto; right: calc(100% + 4px);
      }
    </style>
  </head>
  <body>
    <div id="tab-strip" role="tablist" aria-label="标签页">
      <button type="button" id="show-management" class="tab pinned" role="tab" aria-selected="false">
        <span data-symbol="settings"></span><span>连接器</span>
      </button>
      <div id="tab-list"></div>
      <button type="button" id="new-tab" aria-label="新建标签页" title="新建标签页">+</button>
    </div>
    <form id="browser-toolbar" aria-label="浏览器工具栏">
      <button type="button" id="back" aria-label="后退">←</button>
      <button type="button" id="reload" aria-label="刷新">↻</button>
      <div class="address">
        <span data-symbol="globe"></span
        ><input
          aria-label="网址"
          placeholder="输入网址"
          spellcheck="false"
          autocomplete="off"
        />
        <button type="submit">打开</button>
      </div>
      <button type="button" id="pause" aria-pressed="false">暂停 Agent</button>
    </form>
    <main id="management" hidden>
      <section id="account-list">
        <header class="heading">
          <div class="heading-copy">
            <h1>授权管理</h1>
          </div>
          <div class="actions">
            <button type="button" data-page="settings">连接设置</button>
            <button type="button" class="primary" data-page="invite">添加账号</button>
          </div>
        </header>
        <div class="search">
          <span data-symbol="search"></span>
          <input
            id="account-search"
            type="search"
            aria-label="搜索授权用户"
            placeholder="搜索使用者姓名、团队或平台"
          />
          <output id="account-count" aria-label="匹配账号数"></output>
          <button type="button" id="refresh-management">刷新</button>
        </div>
        <ul id="accounts"></ul>
      </section>
      <section id="settings-page" class="subpage" hidden>
        <button type="button" class="back" data-page="list">‹ 授权管理</button>
        <h1>连接设置</h1>
        <div class="card">
          <form id="settings">
            <input id="platform" placeholder="平台地址" aria-label="平台地址" required /><button
              class="primary"
            >
              保存
            </button>
          </form>
        </div>
      </section>
      <section id="invite-page" class="subpage" hidden>
        <button type="button" class="back" data-page="list">‹ 授权管理</button>
        <h1>添加授权</h1>
        <div class="card">
          <form id="invite">
            <input
              id="invite-url"
              placeholder="设备邀请链接"
              aria-label="设备邀请链接"
              required
            /><button class="primary">添加账号</button>
          </form>
        </div>
      </section>
      <section id="details-page" class="subpage" hidden>
        <button type="button" class="back" data-page="list">‹ 授权管理</button>
        <div id="detail-content"></div>
      </section>
      <p id="management-error" role="status"></p>
      <footer id="connection-status" role="status"></footer>
    </main>
  </body>
</html>
